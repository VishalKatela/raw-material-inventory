version: '3.8'

services:
  raw-material-inventory:
    build:
      context: .
      dockerfile: Dockerfile
    image: raw-material-inventory:latest
    container_name: raw-material-inventory
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=default
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
