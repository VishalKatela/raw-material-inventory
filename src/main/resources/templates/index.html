<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Material Inventory</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            margin: 0 0 10px;
            color: #6b7280;
            font-size: 15px;
        }

        .card .value {
            font-size: 30px;
            font-weight: bold;
        }

        .actions {
            margin-bottom: 20px;
        }

        .filter-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 20px 0;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .filter-bar input,
        .filter-bar select {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
            margin-bottom: 30px;
        }

        .table-container h2 {
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
        }

        .status {
            padding: 6px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .in-stock {
            background: #dcfce7;
            color: #166534;
        }

        .low-stock {
            background: #fef3c7;
            color: #92400e;
        }

        .out-stock {
            background: #fee2e2;
            color: #991b1b;
        }

        .stock-in {
            color: #166534;
            font-weight: bold;
        }

        .stock-out {
            color: #991b1b;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .cards {
                grid-template-columns: 1fr;
            }
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        form input {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        form button {
            width: fit-content;
        }

        @media (max-width: 768px) {
            form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Automated Raw Material Inventory System</h1>
    </div>

    <div class="container">

        <!-- Dashboard Cards -->

        <div class="cards">

            <div class="card">
                <h3>Total Materials</h3>
                <div class="value" id="totalMaterials">0</div>
            </div>

            <div class="card">
                <h3>Total Stock</h3>
                <div class="value" id="totalStock">0</div>
            </div>

            <div class="card">
                <h3>Low Stock Items</h3>
                <div class="value" id="lowStock">0</div>
            </div>

        </div>

        <div class="actions">

            <button onclick="showAddMaterialForm()">
                Add Material
            </button>

            <button onclick="loadMaterials(); loadTransactions();">
                Refresh Inventory
            </button>

        </div>

        <div class="filter-bar">
            <input type="text" id="searchKeyword" placeholder="Search by name or code">
            <select id="statusFilter">
                <option value="">All statuses</option>
                <option value="IN_STOCK">In Stock</option>
                <option value="LOW_STOCK">Low Stock</option>
                <option value="OUT_OF_STOCK">Out of Stock</option>
            </select>
            <input type="text" id="categoryFilter" placeholder="Filter by category">
            <button type="button" onclick="applyFilters()">Apply Filters</button>
        </div>

        <div id="addMaterialForm" class="table-container" style="display:none;">

            <h2>Add New Material</h2>

            <form onsubmit="addMaterial(event)">

                <input type="text" id="materialCode" placeholder="Material Code" required>

                <input type="text" id="materialName" placeholder="Material Name" required>

                <input type="text" id="category" placeholder="Category">

                <input type="text" id="unit" placeholder="Unit e.g. kg">

                <input type="number" id="quantity" placeholder="Quantity" min="0" step="0.01" required>

                <input type="number" id="minimumQuantity" placeholder="Minimum Quantity" min="0" step="0.01" required>

                <button type="submit">
                    Save Material
                </button>

                <button type="button" onclick="hideAddMaterialForm()">
                    Cancel
                </button>

            </form>

        </div>

        <!-- Inventory Table -->

        <div class="table-container">

            <h2>Raw Material Inventory</h2>

            <table>

                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Material Name</th>
                        <th>Category</th>
                        <th>Unit</th>
                        <th>Quantity</th>
                        <th>Minimum</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="materialTable">
                </tbody>

            </table>

        </div>

        <!-- Transaction History -->

        <div class="table-container">

            <h2>Transaction History</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Material</th>
                        <th>Type</th>
                        <th>Quantity</th>
                        <th>Date</th>
                        <th>Remarks</th>
                    </tr>
                </thead>

                <tbody id="transactionTable">
                </tbody>

            </table>

        </div>

    </div>

    <script>

        // Load Materials
        async function loadMaterials() {

            try {

                const response = await fetch('/api/materials');

                const materials = await response.json();

                const table = document.getElementById('materialTable');

                table.innerHTML = '';

                let totalStock = 0;
                let lowStockCount = 0;

                materials.forEach(material => {

                    totalStock += Number(material.quantity);

                    if (material.status === 'LOW_STOCK') {
                        lowStockCount++;
                    }

                    let statusClass = '';

                    if (material.status === 'IN_STOCK') {
                        statusClass = 'in-stock';
                    } else if (material.status === 'LOW_STOCK') {
                        statusClass = 'low-stock';
                    } else if (material.status === 'OUT_OF_STOCK') {
                        statusClass = 'out-stock';
                    }

                    const row = document.createElement('tr');

                    row.innerHTML = `
                    <td>${material.materialCode}</td>
                    <td>${material.name}</td>
                    <td>${material.category || '-'}</td>
                    <td>${material.unit || '-'}</td>
                    <td>${material.quantity}</td>
                    <td>${material.minimumQuantity}</td>
                    <td>
                        <span class="status ${statusClass}">
                            ${material.status}
                        </span>
                    </td>
                `;

                    table.appendChild(row);
                });

                document.getElementById('totalMaterials').textContent =
                    materials.length;

                document.getElementById('totalStock').textContent =
                    totalStock;

                document.getElementById('lowStock').textContent =
                    lowStockCount;

            } catch (error) {

                console.error('Error loading materials:', error);

            }
        }


        // Load Transaction History
        async function loadTransactions() {

            try {

                const response = await fetch('/api/transactions');

                const transactions = await response.json();

                const table = document.getElementById('transactionTable');

                table.innerHTML = '';

                transactions.forEach(transaction => {

                    const row = document.createElement('tr');

                    const transactionClass =
                        transaction.transactionType === 'STOCK_IN'
                            ? 'stock-in'
                            : 'stock-out';

                    row.innerHTML = `
                    <td>${transaction.id}</td>

                    <td>
                        ${transaction.material.name}
                    </td>

                    <td class="${transactionClass}">
                        ${transaction.transactionType}
                    </td>

                    <td>
                        ${transaction.quantity}
                        ${transaction.material.unit}
                    </td>

                    <td>
                        ${formatDate(transaction.transactionDate)}
                    </td>

                    <td>
                        ${transaction.remarks || '-'}
                    </td>
                `;

                    table.appendChild(row);
                });

            } catch (error) {

                console.error('Error loading transactions:', error);

            }
        }


        // Format Date
        function formatDate(dateString) {

            const date = new Date(dateString);

            return date.toLocaleString();

        }


        async function applyFilters() {
            const keyword = document.getElementById('searchKeyword').value;
            const status = document.getElementById('statusFilter').value;
            const category = document.getElementById('categoryFilter').value;

            try {
                const params = new URLSearchParams();
                if (keyword) params.append('keyword', keyword);
                if (status) params.append('status', status);
                if (category) params.append('category', category);

                const response = await fetch('/api/materials/search?' + params.toString());
                const materials = await response.json();
                renderMaterials(materials);
            } catch (error) {
                console.error('Error applying filters:', error);
            }
        }

        function renderMaterials(materials) {
            const table = document.getElementById('materialTable');
            table.innerHTML = '';

            let totalStock = 0;
            let lowStockCount = 0;

            materials.forEach(material => {
                totalStock += Number(material.quantity);

                if (material.status === 'LOW_STOCK') {
                    lowStockCount++;
                }

                let statusClass = '';

                if (material.status === 'IN_STOCK') {
                    statusClass = 'in-stock';
                } else if (material.status === 'LOW_STOCK') {
                    statusClass = 'low-stock';
                } else if (material.status === 'OUT_OF_STOCK') {
                    statusClass = 'out-stock';
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${material.materialCode}</td>
                    <td>${material.name}</td>
                    <td>${material.category || '-'}</td>
                    <td>${material.unit || '-'}</td>
                    <td>${material.quantity}</td>
                    <td>${material.minimumQuantity}</td>
                    <td>
                        <span class="status ${statusClass}">
                            ${material.status}
                        </span>
                    </td>
                `;

                table.appendChild(row);
            });

            document.getElementById('totalMaterials').textContent = materials.length;
            document.getElementById('totalStock').textContent = totalStock;
            document.getElementById('lowStock').textContent = lowStockCount;
        }

        // Load dashboard when page opens
        loadMaterials();
        loadTransactions();

        function showAddMaterialForm() {
            document.getElementById('addMaterialForm').style.display = 'block';
        }

        function hideAddMaterialForm() {
            document.getElementById('addMaterialForm').style.display = 'none';
        }

        async function addMaterial(event) {

            event.preventDefault();

            const material = {
                materialCode: document.getElementById('materialCode').value,
                name: document.getElementById('materialName').value,
                category: document.getElementById('category').value,
                unit: document.getElementById('unit').value,
                quantity: Number(document.getElementById('quantity').value),
                minimumQuantity: Number(
                    document.getElementById('minimumQuantity').value
                )
            };

            try {

                const response = await fetch('/api/materials', {

                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify(material)

                });

                const result = await response.json();

                if (!response.ok) {
                    alert(result.error || 'Failed to add material');
                    return;
                }

                alert('Material added successfully');

                document.querySelector('form').reset();

                hideAddMaterialForm();

                loadMaterials();

            } catch (error) {

                console.error(error);

                alert('Error adding material');
            }
        }

    </script>

</body>

</html>
