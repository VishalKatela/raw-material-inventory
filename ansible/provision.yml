---
- name: Provision Raw Material Inventory
  hosts: app
  become: true
  vars:
    app_name: raw-material-inventory
    app_user: raw-material-inventory
    app_dir: /opt/raw-material-inventory
    app_port: 8080
    artifact_path: "{{ playbook_dir }}/../target/raw-material-inventory-0.0.1-SNAPSHOT.jar"

  tasks:
    - name: Verify application artifact exists on the control machine
      ansible.builtin.stat:
        path: "{{ artifact_path }}"
      delegate_to: localhost
      become: false
      register: application_artifact

    - name: Require a built application artifact
      ansible.builtin.assert:
        that:
          - application_artifact.stat.exists
        fail_msg: "Build the application first or pass -e artifact_path=<path-to-jar>."

    - name: Install Java 21 runtime
      ansible.builtin.apt:
        name: openjdk-21-jre-headless
        state: present
        update_cache: true

    - name: Create application service account
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ app_dir }}"
        create_home: false

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Install application artifact
      ansible.builtin.copy:
        src: "{{ artifact_path }}"
        dest: "{{ app_dir }}/app.jar"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
      notify: Restart application

    - name: Install systemd service
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ app_name }}.service"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Raw Material Inventory application
          After=network.target

          [Service]
          User={{ app_user }}
          Group={{ app_user }}
          WorkingDirectory={{ app_dir }}
          ExecStart=/usr/bin/java -jar {{ app_dir }}/app.jar --server.port={{ app_port }}
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Restart application

    - name: Enable and start application service
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart application
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        state: restarted
        daemon_reload: true